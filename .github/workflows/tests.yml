name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: 'Verified deployed commit to keep; leave empty to publish main'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# New commits supersede older CI runs on the same pull request.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  unittest:
    if: github.event_name != 'workflow_dispatch' || inputs.deployed_sha == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --extra cloud --python 3.11
      - name: Install FFmpeg and FFprobe for audio tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Check deployment helper syntax
        run: |
          bash -n scripts/audit-cloud-storage.sh
          bash -n scripts/preflight-cloud-run.sh
          bash -n scripts/deploy-cloud-run.sh
          bash -n scripts/update-cloud-run.sh
          bash -n scripts/enable-mcp-access.sh
          bash -n scripts/uninstall-cloud-run.sh
      - name: Run tests
        run: uv run --locked --extra cloud --python 3.11 python -m unittest discover -s tests -q
      - name: Build distribution
        run: uv build
  image:
    needs: unittest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Cloud Run image
        run: |
          docker build --tag scribeflow:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Smoke test cloud image dependencies
        run: |
          docker run --rm --entrypoint sh scribeflow:ci -c \
            '! command -v rclone && ffmpeg -version | head -n 1 && python -c "import scribeflow.cloud_entry, scribeflow.cloud_gateway, scribeflow.cloud_worker; print(\"Cloud modules import OK\")"'
      - name: Publish tested image to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag scribeflow:ci "$image"
          docker push "$image"

  prune:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deployed_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove obsolete release images and expired CI records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: python3 scripts/prune-ghcr.py
