name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# New commits supersede older CI runs on the same pull request.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --extra cloud --python 3.11
      - name: Install FFmpeg and FFprobe for audio tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Check deployment helper syntax
        run: |
          bash -n scripts/configure-claim-ttl.sh
          bash -n scripts/deploy-worker-only.sh
          bash -n scripts/audit-cloud-storage.sh
      - name: Validate conservative Artifact Registry policy template
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policies = json.loads(Path("scripts/artifact-cleanup-policy.json").read_text())
          assert len(policies) == 2
          delete = next(p for p in policies if p["action"]["type"] == "Delete")
          keep = next(p for p in policies if p["action"]["type"] == "Keep")
          assert delete["condition"] == {"tagState": "untagged", "olderThan": "90d"}
          assert keep["mostRecentVersions"]["keepCount"] >= 5
          PY
      - name: Run tests
        run: uv run --extra cloud --python 3.11 python -m unittest discover -s tests -q
      - name: Build distribution
        run: uv build
      - name: Build Cloud Run image
        run: docker build --tag scribeflow:ci .
      - name: Smoke test cloud image dependencies
        run: |
          docker run --rm --entrypoint sh scribeflow:ci -c \
            'rclone version && ffmpeg -version | head -n 1 && python -c "import scribeflow.cloud_entry, scribeflow.cloud_gateway, scribeflow.cloud_worker; print(\"Cloud modules import OK\")"'
