[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribeflow"
version = "0.1.0"
description = "Resumable long-form Korean audio transcription with the OpenAI API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0,<4",
    "filelock>=3.20,<4",
    "keyring>=25.0,<27; sys_platform == 'darwin'",
]

[project.scripts]
scribeflow = "scribeflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scribeflow"]
